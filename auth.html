<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Yummy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h1><i class="fas fa-crown"></i> Yummy</h1>
                <p>Excellence culinaire livrée chez vous</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Connexion</button>
                <button class="tab-btn" data-tab="signup">Inscription</button>
            </div>
            
            <div id="login-form" class="auth-form active">
                <h2>Connexion à votre compte</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="login-email" required placeholder="votre@email.com">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="login-password">Mot de passe</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="login-password" required placeholder="••••••••">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Se connecter
                    </button>
                </form>
                
                <div class="auth-footer">
                    <p>Pas encore de compte? <a href="#" class="switch-to-signup">S'inscrire</a></p>
                </div>
            </div>
            
            <div id="signup-form" class="auth-form">
                <h2>Créer un compte</h2>
                <form id="signupForm">
                    <div class="form-group">
                        <label for="signup-name">Nom complet</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="signup-name" required placeholder="John Doe">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="signup-email" required placeholder="votre@email.com">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="signup-password">Mot de passe</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="signup-password" required placeholder="••••••••">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="signup-phone">Téléphone</label>
                        <div class="input-with-icon">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="signup-phone" required placeholder="+33 1 23 45 67 89">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="signup-address">Adresse de livraison</label>
                        <div class="input-with-icon">
                            <i class="fas fa-home"></i>
                            <textarea id="signup-address" rows="2" required placeholder="Votre adresse complète"></textarea>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> S'inscrire
                    </button>
                </form>
                
                <div class="auth-footer">
                    <p>Déjà un compte? <a href="#" class="switch-to-login">Se connecter</a></p>
                </div>
            </div>
            
            <div class="auth-message" id="auth-message"></div>
        </div>
    </div>
    
    <script type="module" src="js/auth.js"></script>
</body>
</html>
